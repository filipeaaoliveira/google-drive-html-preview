<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {%- seo -%}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/hallmark.css' | relative_url }}" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f4fd8'/><path d='M12 9l11 7-11 7z' fill='white'/></svg>" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
      <a class="topbar__mark" href="{{ '/' | relative_url }}">
        <span class="topbar__glyph" aria-hidden="true"></span>
        Drive HTML Preview
      </a>
      <a class="topbar__cta" href="{{ site.repo }}/releases/latest">Download</a>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="colophon">
      <p>
        Drive HTML Preview, version 1.0.1. MIT licensed.
        <a href="{{ site.repo }}">Source</a>.
        <a href="{{ '/PRIVACY.html' | relative_url }}">Privacy</a>.
        <a href="{{ site.repo }}/blob/main/CHANGELOG.md">Changelog</a>.
        <a href="{{ site.repo }}/security/advisories/new">Report a vulnerability</a>.
      </p>
    </footer>
  </body>
</html>
